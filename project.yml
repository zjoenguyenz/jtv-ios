name: JTV
options:
  bundleIdPrefix: com.luun.nguyen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
packages:
  # v1.21: KSPlayer (FFmpeg engine) for the Torrent tab's debrid
  # files only — AVPlayer has no Matroska demuxer, and debrid
  # downloads are predominantly MKV. Pinned exactly, the same
  # version the Joe TV tvOS build runs.
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: "2.3.4"
targets:
  JTV:
    type: application
    platform: iOS
    sources:
      - JTV/JTVApp.swift
      - JTV/ContentView.swift
      - JTV/Models.swift
      - JTV/PluginEngine.swift
      - JTV/PluginManager.swift
      - JTV/MovieService.swift
      - JTV/Library.swift
      - JTV/Cache.swift
      - JTV/Theme.swift
      - JTV/HomeView.swift
      - JTV/CategoryView.swift
      - JTV/SearchView.swift
      - JTV/DetailView.swift
      - JTV/PlayerView.swift
      - JTV/HLSProxy.swift
      - JTV/LocalHLSServer.swift
      - JTV/MangaReaderView.swift
      - JTV/LibraryView.swift
      - JTV/SettingsView.swift
      - JTV/DebridSecrets.swift
      - JTV/DebridResolver.swift
      - JTV/KSPlayerView.swift
      - JTV/TorrentTabView.swift
      - JTV/Plugins
      - JTV/Assets.xcassets
    dependencies:
      - package: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.jtv
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "JTV"
        CFBundleName: "JTV"
        CFBundleShortVersionString: "1.22.3"
        CFBundleVersion: "29"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
